<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筋トレメニュー管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>筋トレメニュー管理</h1>
    <p class="subtitle">メニューの追加・編集・削除・完了管理、エクスポート/インポート対応</p>
  </header>

  <main>
    <section class="form">
      <select id="title">
        <option value="">メニューを選択してください</option>
        <option>ベンチプレス</option>
        <option>スクワット</option>
        <option>デッドリフト</option>
        <option>プランク</option>
        <option>ランジ</option>
        <option>プッシュアップ</option>
        <option>ショルダープレス</option>
        <option>ラットプルダウン</option>
        <option>バーベルロウ</option>
        <option>レッグプレス</option>
        <option>レッグカール</option>
        <option>カーフレイズ</option>
        <option>ダンベルカール</option>
        <option>トライセプスエクステンション</option>
      </select>
      <label class="small">予定日 <input id="date" type="date" /></label>
      <select id="muscle">
        <option value="">部位を選択 (任意)</option>
        <option value="chest">胸 (Chest)</option>
        <option value="back">背中 (Back)</option>
        <option value="legs">脚 (Legs)</option>
        <option value="shoulders">肩 (Shoulders)</option>
        <option value="arms">腕 (Arms)</option>
        <option value="core">体幹 (Core)</option>
        <option value="calves">ふくらはぎ (Calves)</option>
        <option value="full">全身 (Full Body)</option>
      </select>
      <select id="type">
        <option value="strength">筋力</option>
        <option value="hypertrophy">肥大</option>
        <option value="endurance">持久</option>
        <option value="mobility">柔軟</option>
      </select>
      <button id="add">追加</button>
      <button id="clearAll" class="danger">全削除</button>
    </section>

    <section class="controls">
      <input id="filter" placeholder="検索/フィルタ（種目・タイプ）" />
      <select id="muscleFilter">
        <option value="">全ての部位</option>
      </select>
      <label class="small">表示予定日 <input id="dateFilter" type="date" /></label>
      <button id="clearDateFilter">日付フィルタ解除</button>
      <select id="sort">
        <option value="created">追加順</option>
        <option value="type">種類順</option>
        <option value="title">名前順</option>
      </select>
      <button id="export">JSONエクスポート</button>
      <input id="importFile" type="file" accept="application/json" />
    </section>

    <section class="total-load-summary" aria-live="polite">
      <span>全メニュー総負荷</span>
      <strong id="totalLoad">0</strong>
      <span>kg・回</span>
    </section>
    <section id="list" class="list">
      <!-- メニュー一覧 -->
    </section>
    <section class="history">
      <div class="history-heading">
        <div>
          <h2>トレーニング履歴</h2>
          <p>完了したメニューを日付ごとに確認できます</p>
        </div>
        <label class="small">履歴の日付 <input id="historyDate" type="date" /></label>
      </div>
      <div class="history-content">
        <div class="history-chart-wrap">
          <h3>日別の完了種目数（過去30日）</h3>
          <div id="historyChart" class="history-chart"></div>
        </div>
        <div class="history-results">
          <h3 id="historyTitle">選択日の記録</h3>
          <div id="historyList" class="history-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>記録はこのブラウザに保存されます。</footer>
  <script src="app.js"></script>
</body>
</html>
